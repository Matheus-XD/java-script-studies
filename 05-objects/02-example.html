<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Rock paper Scissors game</h1>
  <button onclick="
    computerMove = pickComputerMove();
    playerMove = 'Rock';
    result = calculateResult(playerMove, computerMove);
    calculateScore(result);
    alert(`You: Rock - Computer: ${computerMove} \nresult: ${result} \nScore: \nYou: ${score.playerWin} \nComputer: ${score.computerWin} \nTies: ${score.tie}`)
  ">
    Rock
  </button>

  <button onclick="
    computerMove = pickComputerMove();
    playerMove = 'Paper';
    result = calculateResult(playerMove, computerMove);
    calculateScore(result);
    alert(`You: Paper - Computer: ${computerMove} \nresult: ${result} \n\nScore: \nYou: ${score.playerWin} \nComputer: ${score.computerWin} \nTies: ${score.tie}`)
  ">
    Paper
  </button>

  <button onclick=" 
    computerMove = pickComputerMove();
    playerMove = 'Scissors';
    result = calculateResult(playerMove, computerMove);
    calculateScore(result);
    alert(`You: Scissors - Computer: ${computerMove} \nresult: ${result} \nScore: \nYou: ${score.playerWin} \nComputer: ${score.computerWin} \nTies: ${score.tie}`)
    
  ">
    Scissors
  </button>
  <button onclick="
    score.playerWin = 0;
    score.computerWin = 0;
    score.tie = 0;
  ">
    Reset score
  </button>

  <button onclick="
    alert(`Score \n You: ${score.playerWin} \nComputer: ${score.computerWin} \nTie: ${score.tie}`)
    
  ">
    Show Score
  </button>

  <script>
    let computerMove = '';
    let playerMove = '';
    let score = JSON.parse(localStorage.getItem('score')) || {
      playerWin: 0,
      computerWin: 0,
      tie: 0
    }
    
    function pickComputerMove(){

      randomNumber = Math.random();

      if (randomNumber >= 0 && randomNumber < 1/3){
        return 'Rock';     
      } else if (randomNumber >= 1/3 && randomNumber < 2/3 ) {
        return 'Paper';      
      } else if(randomNumber >= 2/3 && randomNumber < 1){
        return 'Scissors';
      }
    }

    function calculateResult(playerMove, computerMove){
      let result = '';
      if((playerMove === 'Rock' && computerMove === 'Scissors') || (playerMove === 'Paper' && computerMove === 'Rock') || (playerMove === 'Scissors' && computerMove === 'Paper')){
        return 'You won';
      } else if((playerMove === 'Scissors' && computerMove === 'Rock') || (playerMove === 'Rock' && computerMove === 'Paper') || (playerMove === 'Paper' && computerMove === 'Scissors')){
        return 'Computer won';
      } else {
        return 'Tie';
      }
      
    }

    function calculateScore(result) {
      if (result === 'You won') {
        score.playerWin += 1;     
      } else if (result === 'Computer won'){
        score.computerWin += 1;
      } else if (result === 'Tie'){
        score.tie += 1;
      }

      localStorage.setItem('score', JSON.stringify(score))
      return score;
    }
  </script>
</body>
</html>
