  <script>

    const message = 'Good Morning'

    const product1 = {
      name: 'dress',
      price: 95
    }

    const product2 = {
      name: 'shoes',
      price: 95
    }

    function comparePrices(price1, price2) {
      if (price1 > price2) {
        return 'product 2 is cheaper, price: ' + price2;
      } else if (price1 < price2) {
        return 'product 1 is cheaper, price: ' + price1;
      } else {
        return 'prices are the same'
      }
    }

    function isSameProduct(product1, product2) {
      if ((product1.name === product2.name) && (product1.price === product2.price)) {
        return 'product one and product two are the same product'
      } else {
        return 'product one and two are not the same product'
      }
      
    }
    
    console.log(message.toLowerCase())
    console.log(comparePrices(product1.price, product2.price));
    console.log(isSameProduct(product1, product2));
