<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Rock paper Scissors game</h1>
  <button onclick="
    computerMove = pickComputerMove();
    playerMove = 'Rock';
    calculateResult(playerMove, computerMove);
  ">
    Rock
  </button>

  <button onclick="
    computerMove = pickComputerMove();
    playerMove = 'Paper';
    calculateResult(playerMove, computerMove);
  ">
    Paper
  </button>

  <button onclick=" 
    computerMove = pickComputerMove();
    playerMove = 'Scissors';
    calculateResult(playerMove, computerMove);
  ">
    Scissors
  </button>

  <script>
    let computerMove = '';
    let playerMove = '';

    function pickComputerMove(){

      randomNumber = Math.random();

      if (randomNumber >= 0 && randomNumber < 1/3){
        return 'Rock';     
      } else if (randomNumber >= 1/3 && randomNumber < 2/3 ) {
        return 'Paper';      
      } else if(randomNumber >= 2/3 && randomNumber < 1){
        return 'Scissors';
      }
    }

    function calculateResult(playerMove, computerMove){
      let result = '';
      if((playerMove === 'Rock' && computerMove === 'Scissors') || (playerMove === 'Paper' && computerMove === 'Rock') || (playerMove === 'Scissors' && computerMove === 'Paper')){
        result = 'You won';
      } else if((playerMove === 'Scissors' && computerMove === 'Rock') || (playerMove === 'Rock' && computerMove === 'Paper') || (playerMove === 'Paper' && computerMove === 'Scissors')){
        result = 'Computer won';
      } else {
        result = 'Tie';
      }
      alert(`You: Rock \nComputer: ${computerMove} \nresult: ${result}`)
    }
  </script>
</body>
</html>
