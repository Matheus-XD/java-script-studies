<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button onclick="add()">Add</button>
    <button onclick="remove()">Remove</button>

    <script>
        //12g 12h

        let qtd = 0
        function add() {
            qtd += 1
        }
        function remove() {
            qtd -= 1
        }
        function showname() {
            document.title = 'App'
        }
        function showMessages() {
            document.title = `${qtd} messages`
        }
        setInterval(showname, 4000)
        setTimeout(() => {
            setInterval(showMessages, 4000)
        }, 2000);
        
    </script>
</body>
</html>
