<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="todo-list.js" defer></script>
</head>
<body>
  <p>Todo List</p>
  <input class="js-name-input" type="text" placeholder="todo name">
  <button onclick="addToList();">
    Add
  </button>
  <div class="js-todo-list">
    
  </div>
  <script>
    
    let todoList = []

    function addToList() {
      let todo = document.querySelector('.js-name-input');
      todoList.push(todo.value)
      todo.value = '';
      console.log(todoList);
      

      let html = ''
      for (let i = 0; i < todoList.length; i++) {
        html += `<p>${todoList[i]}</p>`  
      }

      document.querySelector('.js-todo-list').innerHTML = html
    }
  </script>
</body>
</html>
