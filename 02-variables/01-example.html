<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cart quantity</title>


</head>
<body>
  <h1>Quantity of products in a shopping cart</h1>
  <p>this program simulates a shopping cart in which you can see the items, add new ones and reset the shopping cart <br> obs: the results will show up on the console</p>


  <button onclick="console.log(`There are ${cartQuantity} products in the cart`);">
    show quantity
  </button>
  <button onclick="cartQuantity += 1; console.log('One product has been added to the cart');">
    add to cart
  </button>
  <button onclick="cartQuantity += 2; console.log('Two products has been added to the cart');">
    +2
  </button>
  <button onclick="cartQuantity += 3; console.log('Three products has been added to the cart');">
    +3
  </button>
  <button onclick="cartQuantity -= 1; console.log('One product has been removed from the cart')">
    remove from cart
  </button>
  <button onclick="cartQuantity = 0; console.log('The cart has been reset')">
    reset cart
  </button>

  </div>
  <script>
    let cartQuantity = 0;
  </script>
</body>
</html>
