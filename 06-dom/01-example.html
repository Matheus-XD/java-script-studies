<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dom</title>
</head>
<body>

  <p>Youtube Subscribe button</p>
  <button class="subscribe-button" onclick="subscribe();">
    Subscribe
  </button>

  <p>Rock paper and Scissors</p>
  <a href="http://127.0.0.1:5500/06-dom/02-example.html">click here</a>

  <p>Amazon Shipping Calculator</p>
  <p>Order under $40 = +$10 shipping</p>
  <p>Order over $40 = FREE shipping</p>
  <input class="input" type="number" placeholder="cost of order">
  <button class="calculate" onclick="
    calculateShipping();
    showResult();
  ">
  calculate
  </button>
  <p class="result"></p>

  <script>
    
    function subscribe() {
      const subscribeButton = document.querySelector('.subscribe-button');
      if (subscribeButton.innerText === 'Subscribe') {
        subscribeButton.innerText = 'Subscribed';
      } else {
        subscribeButton.innerText = 'Subscribe';
      }
      
    }
    
    let result = 0;
    function calculateShipping() {
      const input = document.querySelector('.input');
      cost = parseFloat(input.value);

      if (cost < 40) {
        result = cost + 10;
      } else {
        result = cost;
      }     
    }

    function showResult() {
      document.querySelector('.result').innerText = '$' + result;
    }
  </script>
</body>
</html>
