<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src=" "></script>
  <style>
    body{
      background-color: rgb(25,25,25);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .buttons{
      display: flex;
      justify-content: center;
    }
    .playerMoveButton{
      margin:10px;
      height: 120px;
      width: 120px;
      border-radius: 75px;
      border-color: white;
      background-color: transparent;
      border-style: solid;
    }
    .playerMoveButton:hover{
      border-color: rgb(106, 153, 78);
    }
    .playerMoveImages{
      height: 80px;
      
    }

    .result-images{
      height: 60px;
    }

    .reset-score-button{
      padding: 5px 10px;
      border-style: none;
      border-radius: 5px;
      font-size: 15px;
    }
    .reset-score-button:hover{
      background-color: lightgoldenrodyellow;
    }
  </style>
</head>
<body>
  <h1>Rock paper Scissors game</h1>
  <div class="buttons">
    <button class="playerMoveButton" onclick="
      playGame('rock');
    ">
      <img class="playerMoveImages" src="images/rock-emoji.png" alt="">
    </button>

    <button class="playerMoveButton" onclick="
      playGame('paper');
    ">
      <img class="playerMoveImages" src="images/paper-emoji.png" alt="">
    </button>

    <button class="playerMoveButton" onclick="
      playGame('scissors');
    ">
      <img class="playerMoveImages" src="images/scissors-emoji.png" alt="">
    </button>
  </div>
  
  <h2 class="result-text">Result</h2>
  <p class="result">
    
  
  </p>

  <h2>Score</h2>
  <p>You: <span class="player-wins">0</span>, Computer: <span class="computer-wins">0</span>, Ties: <span class="ties">0</span></p>
  
  


  <button class="reset-score-button"  
  onclick="
    score.playerWin = 0;
    score.computerWin = 0;
    score.tie = 0;
    updateScore();
    showResult('Start the game!')
  ">
    Reset score
  </button>

  <script>
    let computerMove = '';
    let playerMove = '';
    let score = JSON.parse(localStorage.getItem('score')) || {
      playerWin: 0,
      computerWin: 0,
      tie: 0
    }

    function updateScore() {
      document.querySelector('.player-wins').innerHTML = score.playerWin;
      document.querySelector('.computer-wins').innerHTML = score.computerWin;
      document.querySelector('.ties').innerHTML = score.tie;    
    }

    function showResult(playerMove, computerMove) {
      document.querySelector('.result').innerHTML= 
      `You <img class="result-images" src="images/${playerMove}-emoji.png" alt=""> <img class="result-images" src="images/${computerMove}-emoji.png" alt=""> Computer`;
      
    }
    
    function pickComputerMove(){

      randomNumber = Math.random();

      if (randomNumber >= 0 && randomNumber < 1/3){
        return 'rock';     
      } else if (randomNumber >= 1/3 && randomNumber < 2/3 ) {
        return 'paper';      
      } else if(randomNumber >= 2/3 && randomNumber < 1){
        return 'scissors';
      }
    }

    function playGame(playerMove){
      const computerMove = pickComputerMove();
     
      if((playerMove === 'rock' && computerMove === 'scissors') || (playerMove === 'paper' && computerMove === 'rock') || (playerMove === 'scissors' && computerMove === 'paper')){
        document.querySelector('.result-text').innerText = 'You won'    
        calculateScore('You won');
      } else if((playerMove === 'scissors' && computerMove === 'rock') || (playerMove === 'rock' && computerMove === 'paper') || (playerMove === 'paper' && computerMove === 'scissors')){
        document.querySelector('.result-text').innerText = 'Computer won'
        calculateScore('Computer won');
      } else {
        document.querySelector('.result-text').innerText = 'Tie'
        calculateScore('Tie');
      }
      
      
      showResult(playerMove, computerMove)
      updateScore();
    }

    function calculateScore(result) {
      if (result === 'You won') {
        score.playerWin += 1;
            
      } else if (result === 'Computer won'){
        score.computerWin += 1;
      } else if (result === 'Tie'){
        score.tie += 1;
      }

      localStorage.setItem('score', JSON.stringify(score))
      return score;
    }

  </script>
</body>
</html>
