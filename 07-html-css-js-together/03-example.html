<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dom with css</title>
  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
    }

    .calculator-title{
      margin-top: 60px;
    }

    .input{
      display: flex;
      align-items: center;

    }
    .bar{
      font-size: 15px;
      padding: 10px;
    
      
    }
    .calculate{
      font-size: 15px;
      padding: 12px;
      margin-left: 5px;
      background-color: green;
      color: white;
      border: none;
      cursor: pointer;
    }

    .js-error-result{
      color: red;
    }

  </style>
</head>
<body>


  <p class="calculator-title">Amazon Shipping Calculator</p>
  <p>Order under $40 = +$10 shipping</p>
  <p>Order over $40 = FREE shipping</p>

  <div class="input">
    <input class="js-bar bar" type="number" placeholder="cost of order"
    onkeydown="
      if (event.key === 'Enter') {
        calculateShipping();
      }
    "
    >
    <button class="calculate" 
    onclick="
      calculateShipping();
    "
    >
    calculate
    </button>
  </div>
  <p class="result js-result"></p>
  

  <script>
    
    
    function calculateShipping() {
      let result = document.querySelector('.js-result');
      const bar = document.querySelector('.js-bar');
      const cost = Number(bar.value);

      if (result.classList.contains('js-error-result')) {
        result.classList.remove('js-error-result')
      }
      if (!cost) {
        result.classList.add('js-error-result');
        result.innerText = 'please enter a value'
        
      } else if (cost >= 0 && cost < 40) {
        result.innerText = '$' + (cost + 10);
      } else if (cost >= 40){
        result.innerText = '$'+ cost;
      } else if (cost < 0) {
        result.classList.add('js-error-result');
        result.innerText = 'Error: cost cannot be less than $0'
      }
    }

    function calculateShippingEnter(event) {
      if (event.key === 'Enter') {
        calculateShipping();
      }
    }

    
  </script>
</body>
</html>
