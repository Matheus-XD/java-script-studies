<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .button{
            background-color: rgb(211, 208, 208);
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
        }
        .button-onclick{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <button class="button gaming"
    onclick="
    changeButtonOnClick('gaming');
    ">
        Gaming
    </button>
    <button class="button music"
    onclick="
    changeButtonOnClick('music');
    ">
        Music
    </button>
    <button class="button tech"
    onclick="
    changeButtonOnClick('tech');
    ">
        Tech
    </button>

    <script>
        function changeButtonOnClick(className) {
            let button1 = document.querySelector(`.${className}`);
            let button2 = '';
            let button3 = '';
            if (className === 'gaming') {
                button2 = document.querySelector('.music');
                button3 = document.querySelector('.tech');
            } else if (className ==='music') {
                button2 = document.querySelector('.gaming')
                button3 = document.querySelector('.tech')
            } else if (className === 'tech') {
                button2 = document.querySelector('.gaming')
                button3 = document.querySelector('.music')
            }


            if (!button1.classList.contains('button-onclick')) {
                button1.classList.add('button-onclick');
                button2.classList.remove('button-onclick')
                button3.classList.remove('button-onclick')
                
            } else {
                button1.classList.remove('button-onclick');
                
            }
        }
    </script>
</body>
</html>
