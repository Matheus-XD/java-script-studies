<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .input{
            display: flex;
            flex-direction: row;
            height: 40px;
            
        }
        .name{
           font-size: 20px;
        }
        .date{
            margin-left: 20px;
            font-size: 20px;
        }
        .button{
            margin-left: 20px;
            font-size: 20px;
            width: 100px;      
        }

        
        

    </style>
</head>
<body>
    <h1>Todo List</h1>
    <div class="input">
        <input class= "name js-name-input" type="text" placeholder="todo name">
        <input class="date js-date-input" type="date">
        <button class="button" onclick="addToList();">add</button>
        
    </div>
    

    <div class="result js-todoList">
        <p>do the laundry</p>
        <p">02/06/2026</p>
        <button>remove</button>    
    </div>
    

    <script>
        let todoList = []
        function addToList() {
            const todo = {
                name: document.querySelector('.js-name-input').value,
                date: document.querySelector('.js-date-input').value
            }
            todoList.push(todo)
            console.log(todoList);
            renderHTML();
        }
            

        function renderHTML() {
            let htmlList = '';
            for (let i = 0; i < todoList.length; i++) {
                htmlList += `
                <p>${todoList[i].name}</p>
                <p>${todoList[i].date}</p>
                <button onclick = "
                todoList.splice(${i}, 1);
                renderHTML()

                ">remove</button>
                
             `}        
            document.querySelector('.js-todoList').innerHTML = htmlList;
        }
        



    </script>
</body>
</html>
