<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: lightgray;
        }
        .input{
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 480px;          
        }
        .name{
            box-sizing: border-box;
            border-style: solid;
            border-radius: 10px;
            border-width: 1px;
            height: 50px;
            width: 180px; 
            font-size: 17px;    
            
        }
        .date{
            border-style: solid;
            border-radius: 10px;
            border-width: 1px;
            box-sizing: border-box;
            height: 50px;
            width: 150px;
            font-size: 17px;
        }
        .button{
            height: 50px;
            width: 120px;
            font-size: 18px;
            background-color: rgb(61, 209, 61);
            border-width: 1px;
            border-style: solid;
            border-radius: 10px;
            cursor: pointer;
        }
        

        .result{
            margin-top: 20px;
            width: 480px;
            display: flex;
            flex-direction: row;
            flex: 180px 150px 120px ;
            align-items: center;
            justify-content: space-between;
            
        }
        p{
            font-size: 20px;
        }
        .result-name{
            width: 180px;
        }
        .result-date{
            width: 150px;
            
        }
        .result .button{
            background-color: red;
            color: white;
        }
        
    </style>
</head>
<body>
    <h1>Todo List</h1>
    <div class="input">
        <input class= "name js-name-input" type="text" placeholder="todo name">
        <input class="date js-date-input" type="date">
        <button class="button" onclick="addToList();">add</button>
        
    </div>
    

    <div class="js-todoList">  
        
    </div>
    

    <script>
        let todoList = JSON.parse(localStorage.getItem('todoList')) || [];
        renderHTML()
        
        function addToList() {
            const todo = {
                name: document.querySelector('.js-name-input').value,
                date: document.querySelector('.js-date-input').value
            }
            todoList.push(todo)
            console.log(todoList);
            renderHTML();
            saveData();
        }
        
        function deleteFromList(index) {
            todoList.splice(index, 1);
            renderHTML();
            saveData();
            
        }

        function saveData() {
            localStorage.setItem('todoList', JSON.stringify(todoList))
        }

        function renderHTML() {
            let htmlList = '';
            for (let i = 0; i < todoList.length; i++) {
                htmlList += `
                <div class = "result">
                    <p class="result-name">${todoList[i].name}</p>
                    <p class="result-date">${todoList[i].date}</p>
                    <button class="button" onclick = "
                    deleteFromList(${i});
                    ">remove</button>
                </div>
             `}        
            document.querySelector('.js-todoList').innerHTML = htmlList;
            
        }
        



    </script>
</body>
</html>
