    function findIndex(array, word) {
      let index = -1;
      for (let i = 0; i < array.length; i++) {
        if (array[i] === word) {
          index = i
          break
        }
      }
      return index
    }

    function unique(array) {
      let newArray = []
      for (let i = 0; i < array.length; i++) {
        const word = array[i];
        if (findIndex(newArray, word) === -1) {
          newArray.push(word)
        }
      }
      return newArray;
      
    }

    console.log(unique(stringsArray));
